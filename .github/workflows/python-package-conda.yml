name: Verify trainer sync

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          else
            echo "No scripts/*.sh to check; skipping bash -n"
          fi

      - name: Verify trainer sync
        run: timeout 30s ./scripts/verify_trainer_sync.sh
