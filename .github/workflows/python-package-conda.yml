name: Verify trainer sync

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check shell scripts
        run: |
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          else
            echo "No scripts/*.sh to check; skipping bash -n"
          fi

      - name: Check CHANGELOG drift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check_changelog_drift.sh

      - name: Verify trainer sync
        run: timeout 30s ./scripts/verify_trainer_sync.sh

      - name: Phase 11 offline gates smoke
        run: python3 tests/test_verify_phase11_synthesis_gates.py
