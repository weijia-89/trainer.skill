name: Trainer PR review gate

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  codereview-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.1.2

      - name: Anti-theater contract self-tests (no network)
        run: |
          timeout 60s bash scripts/verify_trainer_codereview.sh
          GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash scripts/verify_trainer_sync.sh

      - name: Check reviewer comment format
        run: |
          set -euo pipefail
          COMMENTS=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.number }}/comments" --paginate 2>/dev/null || echo "[]")
          # Select the first comment bearing the trainer/sdk codereview marker.
          MARKED=$(printf '%s' "$COMMENTS" | jq -r 'first(.[] | select((.body // "") | test("trainer-codereview-|sdk-codereview-")) | .body)')
          if [[ -z "$MARKED" ]]; then
            echo "SKIP  no trainer/sdk review comment posted yet; format check deferred to review gate"
            exit 0
          fi
          # Require the sections the gate expects
          grep -q '### Trainer notes' <<< "$MARKED"   || exit 1
          grep -q '### Bug inventory' <<< "$MARKED"     || exit 1
          grep -q '### Automated verification' <<< "$MARKED" || exit 1
          grep -q 'verdict=APPROVE' <<< "$MARKED"      || exit 1
          grep -q 'head=' <<< "$MARKED"               || exit 1
          grep -q 'trainer-codereview-' <<< "$MARKED"   || exit 1
          echo "Reviewer comment format OK"
      
      - name: Trainer PR review comment gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash scripts/ci-trainer-pr-review-gate-exempt.sh "${{ github.repository }}" "${{ github.event.pull_request.number }}"; then
            echo "SKIP  docs-only PR — comment gate not required"
            exit 0
          fi
          bash scripts/ci-trainer-pr-review-gate.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.head.ref }}" \
            "${{ github.repository }}"

  generation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.1.2

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Generation gate
        run: |
          echo "=== Running generation gate on modified .sh files ==="
          # Use base SHA for cross-fork compatibility (works when origin/base_ref doesn't)
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base_sha" ]]; then
            # Fallback for non-PR triggers (if any)
            base_sha="origin/${{ github.base_ref }}"
          fi
          changed=$(git diff --name-only "${base_sha}...HEAD" | grep '\.sh$' || true)
          if [[ -z "$changed" ]]; then
            echo "SKIP  no .sh files modified"
            exit 0
          fi
          # Pass files safely using array to prevent word-splitting
          file_args=()
          while IFS= read -r f; do
            [[ -n "$f" ]] && file_args+=("$f")
          done <<< "$changed"
          bash specialists/form-check/tools/generation_gate.sh --strict "${file_args[@]}"
