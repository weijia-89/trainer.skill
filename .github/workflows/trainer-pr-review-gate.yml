name: Trainer PR review gate

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  codereview-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.1.2

      - name: Anti-theater contract self-tests (no network)
        run: |
          timeout 60s bash scripts/verify_trainer_codereview.sh
          GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash scripts/verify_trainer_sync.sh

      - name: Trainer PR review comment gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash scripts/ci-trainer-pr-review-gate-exempt.sh "${{ github.repository }}" "${{ github.event.pull_request.number }}"; then
            echo "SKIP  docs-only PR — comment gate not required"
            exit 0
          fi
          bash scripts/ci-trainer-pr-review-gate.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.head.ref }}" \
            "${{ github.repository }}"

  generation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.1.2

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Generation gate
        run: |
          echo "=== Running generation gate on modified .sh files ==="
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.sh$' || true)
          if [[ -z "$changed" ]]; then
            echo "SKIP  no .sh files modified"
            exit 0
          fi
          bash specialists/form-check/tools/generation_gate.sh --strict $changed
