# high-stakes-list.yaml
#
# Project freeze list. Each entry names a file or directory whose edits require an
# explicit `precondition` declaration in any agent's daily-log manifest entry that
# would touch it. The validator (Phase 2 deliverable `scripts/validate-daily-log.py`)
# refuses to render the prompt for any agent whose `owned_paths` intersect this list
# unless the agent's manifest entry declares `precondition: <one-of-allowed-values>`
# AND a sibling-or-earlier-phase agent in the same daily log has `produces:` covering
# the research artifact named by the precondition.
#
# Location: <project>/localonly/daily/high-stakes-list.yaml
# Gitignored per the localonly/ convention.
#
# Schema:
#   freeze:
#     <path-or-glob>:
#       allowed_preconditions: [research-complete | spec-locked | schema-frozen | <project-defined>]
#       rationale: <one-line: why this file is high-stakes>
#       last_reviewed: <YYYY-MM-DD>
#
# Allowed precondition vocabulary (extend per project):
#   - research-complete: a research agent's deliverable exists and Wei has signed off
#   - spec-locked: the locked spec at the named path has the current lock-date annotation
#   - schema-frozen: schema migration ADR exists; rollback plan documented
#   - <project-defined>: any project-specific gate; document in the rationale field

freeze: {}

# ---------------------------------------------------------------------------
# Annotated starter examples below. Strip the examples block before deploying
# this file to a real project; replace with the project's actual freeze entries.
# ---------------------------------------------------------------------------

